name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build user documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the package and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs .
      - name: Build and audit the user site
        run: make docs PYTHON=python DOCS_BUILD_DIR="$RUNNER_TEMP/llgm-docs"
      - name: Upload the audited HTML
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/llgm-docs

  deploy:
    name: Deploy to GitHub Pages
    if: vars.DOCS_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the audited HTML
        id: deployment
        uses: actions/deploy-pages@v4
