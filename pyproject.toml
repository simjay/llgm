[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llgm"
version = "0.1.0a3"
description = "Recursive evidence access over persistent conversation sources"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Documentation = "https://llgm.readthedocs.io/"
Repository = "https://github.com/simjay/llgm"
Issues = "https://github.com/simjay/llgm/issues"

[project.optional-dependencies]
rlm = ["dspy[deno]==3.3.1", "deno==2.9.6"]
openai = ["openai>=2.54,<3"]
benchmark = ["dspy[deno]==3.3.1", "deno==2.9.6", "openai>=2.54,<3", "tiktoken==0.11.0"]
anthropic = ["anthropic>=0.125,<1"]
s3 = ["boto3>=1.35,<2"]
tokenizers = ["transformers>=4.45,<5", "tiktoken>=0.9,<1"]
colbert = ["colbert-ai>=0.2.21,<0.3", "torch>=2.2", "transformers>=4.45,<5", "faiss-cpu>=1.8"]
modal = ["modal==1.5.5"]

[dependency-groups]
dev = ["dspy[deno]==3.3.1", "deno==2.9.6", "pytest>=8,<10", "ruff==0.16.6", "coverage>=7.10,<8", "build>=1.2", "twine>=6"]
docs = ["sphinx==8.2.3", "myst-parser==4.0.1", "sphinx-rtd-theme==3.1.0", "sphinxcontrib-mermaid==2.0.2"]

[project.scripts]
llgm = "llgm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llgm"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/experiments", "/tools", "/pyproject.toml", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/Makefile", "/.readthedocs.yaml", "/.github/workflows/ci.yml", "/.github/workflows/colbert.yml", "/.github/workflows/docs.yml", "/.github/workflows/publish.yml"]
exclude = ["/docs/_build", "/docs/_static/brand/explorations", "/docs/contributing/brand-explorations", "/experiments/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: checks across real component boundaries",
    "dataset: requires optional checksum-pinned local benchmark data",
    "live: explicitly opted-in hosted provider calls (may incur charges)",
    "openai: opted-in OpenAI native schema contract",
    "anthropic: opted-in Anthropic native schema contract",
    "embedding: opted-in hosted embedding contract",
    "colbert: opted-in local official ColBERT/PLAID build and reopen",
    "sandbox: opted-in DSPy Deno/Pyodide isolation and callback checks",
    "s3: opted-in S3 blob publication, restart and exact-object cleanup",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["src/llgm"]
relative_files = true
data_file = "runs/coverage/unit/.coverage"

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "runs/coverage/unit/html"

[tool.coverage.xml]
output = "runs/coverage/unit/coverage.xml"

[tool.coverage.json]
output = "runs/coverage/unit/coverage.json"
